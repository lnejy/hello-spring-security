<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .error-code { font-size: 6rem; font-weight: 900; color: #e94560; line-height: 1; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
    </div>
</nav>

<div class="container text-center py-5">
    <div class="error-code">403</div>
    <h3 class="fw-bold mt-3">접근이 거부되었습니다</h3>
    <p class="text-muted">해당 페이지에 접근할 권한이 없습니다. (ROLE_ADMIN 필요)</p>
    <a th:href="@{/home}" class="btn btn-primary mt-3">홈으로 돌아가기</a>

    <div th:replace="~{fragments/footer :: info}" class="mt-5"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
